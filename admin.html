<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🛠 Admin Panel</h1>
    <div>
      <span class="muted" id="welcomeName" style="margin-right:14px;"></span>
      <button class="secondary" id="logoutBtn">Log out</button>
    </div>
  </header>

  <div class="container">

    <div class="tabs">
      <button class="active" data-tab="payments">Payments</button>
      <button data-tab="students">Students</button>
      <button data-tab="settings">Zoom & Recordings</button>
    </div>

    <!-- PAYMENTS TAB -->
    <div id="tab-payments">
      <div class="card">
        <h2>Pending Payment Slips</h2>
        <div id="pendingList"><p class="muted">Loading…</p></div>
      </div>
    </div>

    <!-- STUDENTS TAB -->
    <div id="tab-students" style="display:none;">
      <div class="card">
        <h2>All Students — <span id="studentsMonthLabel"></span></h2>
        <div id="studentsList"><p class="muted">Loading…</p></div>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" style="display:none;">
      <div class="card">
        <h2>Zoom Link</h2>
        <label>Current Zoom class link</label>
        <input type="url" id="zoomLinkInput" placeholder="https://zoom.us/j/..." />
        <button id="saveZoomBtn">Save Zoom Link</button>
        <p class="muted" id="zoomSavedMsg" style="display:none;">Saved ✓</p>
      </div>

      <div class="card">
        <h2>Class Recordings</h2>
        <div id="recordingsEditor"></div>
        <button class="secondary" id="addRecordingBtn" type="button">+ Add Recording</button>
        <div style="margin-top:16px;">
          <button id="saveRecordingsBtn">Save Recordings</button>
          <p class="muted" id="recSavedMsg" style="display:none;">Saved ✓</p>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
